name: Shared Development CI

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  validate:
    name: Source and build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate 1
        run: python3 scripts/ci/check_source.py

  gate:
    name: ci / gate
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != success ]; then
            echo 'Validation failed, was cancelled, or was skipped.'
            exit 1
          fi
